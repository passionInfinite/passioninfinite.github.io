project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - viz.js

website:
  title: "Hardik Patel | Model Interpretability"
  description: "Research notes on AI model visibility and behaviour, using open-source models and interpretability tools."
  site-url: https://passioninfinite.com
  repo-url: https://github.com/passionInfinite/passioninfinite.github.io
  repo-actions: [issue]
  open-graph: true
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/passionInfinite
      - icon: linkedin
        href: https://www.linkedin.com/in/passioninfinite/
      - icon: rss
        href: index.xml

format:
  html:
    theme: theme.scss
    css: styles.css
    toc: true
    code-fold: show
    code-tools: true
    highlight-style: a11y

language:
  listing-page-no-matches: "The first post is on its way."

execute:
  # Posts are run on your Mac and the results are committed (_freeze/).
  # GitHub Actions never needs to download a model.
  freeze: true
